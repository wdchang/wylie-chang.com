<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wylie-chang.com</title>
<style>
  :root {
    --bg: #faf9f7;
    --ink: #1a1a18;
    --muted: #6b6a66;
    --accent: #c05621;
    --line: #e5e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --ink: #f2f0ea;
      --muted: #9a978f;
      --accent: #f0a868;
      --line: #2c2b26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  main {
    max-width: 34rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.5rem, 9vw, 4.5rem);
    line-height: 1.05;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  p {
    font-size: 1.125rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 2rem;
  }
  .rule {
    width: 3rem;
    height: 1px;
    background: var(--line);
    margin: 0 auto 2rem;
    border: 0;
  }
  footer {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8125rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <main>
    <h1>Hello, <span>world</span>.</h1>
    <hr class="rule">
    <p>This is wylie-chang.com. It works, it&rsquo;s live, and it cost nothing to host.</p>
    <footer>wylie-chang.com</footer>
  </main>
</body>
</html>
