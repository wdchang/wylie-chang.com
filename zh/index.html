      <p>我是麻省總醫院急診醫學部緊急醫療服務組的研究員。我研究急診醫學，特別關注精神科急症中的醫病共享決策。我的研究由幾組問題所引導：社會秩序、人際合作，以及個人在醫療機構之中如何行使能動性。我也關注機構的組織、治理與正當性，以及科學與醫學史。在轉向醫學之前，我曾領導數個公民組織，包括 Democracy House、Register2Vote.org 與 Lead for America。我在哈佛大學修習理科課程，並在塔夫茨大學主修哲學、政治學與經濟學。</p>
